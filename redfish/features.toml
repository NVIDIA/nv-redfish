[[oem-features]]
# NVIDIA BlueField DPU computer system extension.
vendor = "nvidia-bluefield"
name = "computer-systems"
oem_csdl_files = [
    "NvidiaComputerSystem_v1.xml",
]
csdl_files = []

# NVIDIA OEM schemas, vendored verbatim from NVIDIA/bmcweb
# (redfish-core/schema/oem/nvidia/csdl) at commit
# 145ee5400553630637f01734915abde5915751a7 of the `develop` branch.
# Re-vendoring means replacing schema/oem/nvidia-baseboard/*.xml from
# that path wholesale and updating this commit id; the files are not
# edited locally, so fix schema problems upstream instead.
#
# Every schema below is a compile root. The blocks are keyed on the
# service feature that owns the resource being extended, so enabling
# `oem-nvidia-baseboard` alongside `chassis` compiles the NVIDIA chassis
# schemas and nothing else. Families with no standard counterpart get
# their own `oem-nvidia-*` feature.
#
# The BlueField DPU is a separate vendor: it reuses the
# `NvidiaComputerSystem` namespace for an incompatible shape, so the two
# cannot share a compile unit.
#
# A block lists only the schemas it owns. NVIDIA schemas reference each
# other freely; build.rs offers every unselected schema of the vendor
# for type resolution, so a block never needs its dependencies listed.
# Each schema must therefore appear in exactly one block.

[[oem-features]]
# Standard schemas the NVIDIA set references. Always active, since the
# `oem-nvidia-baseboard` feature is what enables this vendor at all. Kept in one
# place rather than repeated per block; extra entries only cost parse
# time, so this is the transitive closure of every NVIDIA reference
# that resolves inside the DMTF tree. No NVIDIA schema reaches a
# Swordfish-only type, so none are listed.
vendor = "nvidia-baseboard"
name = "oem-nvidia-baseboard"
oem_csdl_files = []
csdl_files = [
